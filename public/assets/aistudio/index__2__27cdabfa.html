<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOP Digital Logs — Extrusion &amp; Injection</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#161A1E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --ink:#161A1E; --panel:#1E252B; --panel-2:#252D34;
  --steel:#3E7CB1; --steel-dim:#2E5C85;
  --amber:#E3A008; --amber-soft:#FBEBC8;
  --green:#3F8F5F; --red:#C0442C;
  --bg:#EEF0F1; --surface:#FFFFFF; --line:#D8DCDE;
  --text:#1B2024; --text-dim:#5B6570; --text-inv:#F2F4F5;
  --radius:4px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;height:100vh;overflow:hidden;}
.mono{font-family:'IBM Plex Mono',monospace;}
#app{display:flex;height:100vh;}
#sidebar{width:225px;background:var(--ink);color:var(--text-inv);display:flex;flex-direction:column;flex-shrink:0;}
#brand{padding:20px 18px 16px 18px;border-bottom:1px solid #2A3138;}
#brand .name{font-weight:700;font-size:15px;letter-spacing:.2px;line-height:1.3;}
#brand .sub{font-size:10.5px;color:#8A97A3;margin-top:5px;font-family:'IBM Plex Mono',monospace;}
nav{flex:1;padding:14px 0;}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 18px;color:#B7C0C8;cursor:pointer;font-size:13px;font-weight:500;border-left:3px solid transparent;}
.nav-item .dot{width:6px;height:6px;border-radius:50%;background:#4A5560;flex-shrink:0;}
.nav-item:hover{background:#1F262C;color:var(--text-inv);}
.nav-item.active{background:var(--panel-2);color:var(--text-inv);border-left:3px solid var(--amber);}
.nav-item.active .dot{background:var(--amber);}
#sidebar-foot{padding:14px 18px;border-top:1px solid #2A3138;font-size:10.5px;color:#6E7A85;line-height:1.5;}
#main{flex:1;display:flex;flex-direction:column;min-width:0;}
#topbar{height:58px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:10px;flex-shrink:0;}
#topbar h1{font-size:16px;font-weight:600;margin:0;flex:1;}
.pill{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:4px 9px;border-radius:20px;background:#F1E6E1;color:#8A3E22;font-weight:600;}
#content{flex:1;overflow-y:auto;padding:24px 28px 60px 28px;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;}
.section-head h2{font-size:19px;margin:0;font-weight:700;}
.section-head p{margin:4px 0 0 0;color:var(--text-dim);font-size:13px;}
.grid{display:grid;grid-template-columns:360px 1fr;gap:20px;align-items:start;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;}
.card h3{font-size:12.5px;margin:0 0 14px 0;font-weight:700;padding-bottom:10px;border-bottom:1px solid var(--line);}
.field{margin-bottom:11px;}
.field label{display:block;font-size:11px;font-weight:600;color:var(--text-dim);margin-bottom:5px;}
.field input, .field select{width:100%;padding:8px 9px;border:1px solid #C6CCD0;border-radius:var(--radius);font-family:'IBM Plex Sans',sans-serif;font-size:13px;background:#FAFBFB;}
.field input:focus, .field select:focus{outline:2px solid var(--steel);outline-offset:-1px;background:#fff;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.btn-primary{width:100%;background:var(--ink);color:#fff;border:none;padding:11px;border-radius:var(--radius);font-weight:600;font-size:13.5px;cursor:pointer;margin-top:6px;}
.btn-primary:hover{background:#262E35;}
.table-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap;}
.table-toolbar .count{font-size:12px;color:var(--text-dim);}
.btn-ghost{background:#fff;border:1px solid #C6CCD0;color:var(--text);padding:7px 13px;border-radius:var(--radius);font-size:12.5px;font-weight:600;cursor:pointer;}
.btn-ghost:hover{background:#F3F4F5;}
table{width:100%;border-collapse:collapse;background:var(--surface);}
thead th{text-align:left;font-size:10.5px;font-weight:700;color:var(--text-dim);padding:9px 11px;border-bottom:2px solid var(--line);white-space:nowrap;}
tbody td{padding:9px 11px;border-bottom:1px solid var(--line);font-size:12.5px;white-space:nowrap;}
tbody tr:hover{background:#F7F8F8;}
.status{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-block;}
.status.pass{background:#E4F0E7;color:var(--green);}
.status.fail{background:#F7E3D9;color:var(--red);}
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;overflow-x:auto;}
#toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:13px 18px;border-radius:var(--radius);font-size:13px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);transform:translateY(20px);opacity:0;pointer-events:none;transition:all .25s ease;max-width:360px;}
#toast.show{transform:translateY(0);opacity:1;}
#toast .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);flex-shrink:0;}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
.kpi .num{font-size:24px;font-weight:700;font-family:'IBM Plex Mono',monospace;}
.kpi .lbl{font-size:11px;color:var(--text-dim);margin-top:4px;font-weight:600;}
.kpi.warn .num{color:var(--red);}
.pareto{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:20px;}
.pareto h3{margin:0 0 14px 0;font-size:13px;font-weight:700;}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.bar-label{width:170px;font-size:12px;color:var(--text-dim);flex-shrink:0;}
.bar-track{flex:1;background:#EEF0F1;border-radius:3px;height:16px;overflow:hidden;}
.bar-fill{height:100%;background:var(--amber);}
.bar-val{width:60px;text-align:right;font-size:12px;font-family:'IBM Plex Mono',monospace;flex-shrink:0;}
.note{margin-top:20px;background:#F3F5F1;border:1px solid #D9E0D4;border-left:3px solid var(--green);border-radius:var(--radius);padding:12px 15px;font-size:12.5px;color:#3C4A3B;line-height:1.55;}
.note strong{color:#25321F;}
#hamburger{display:none;background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;padding:4px 8px;margin-right:2px;}
#backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;}
#backdrop.show{display:block;}

/* ---------------- Responsive: phones & narrow tablets ---------------- */
@media (max-width: 860px){
  #hamburger{display:block;}
  #sidebar{position:fixed;top:0;left:0;bottom:0;width:225px;z-index:50;transform:translateX(-100%);transition:transform .2s ease;}
  #sidebar.open{transform:translateX(0);}
  #topbar{flex-wrap:wrap;height:auto;padding:10px 14px;gap:8px;}
  #topbar h1{flex:1 1 auto;font-size:15px;}
  #topbar .btn-ghost{font-size:11.5px;padding:7px 10px;}
  #content{padding:16px 14px 50px 14px;}
  .grid{grid-template-columns:1fr;}
  .kpi-row{grid-template-columns:repeat(2,1fr);gap:10px;}
  .kpi .num{font-size:20px;}
  .field-row{flex-direction:column;gap:0;}
  table{min-width:640px;}
}
@media (max-width: 420px){
  .kpi-row{grid-template-columns:1fr 1fr;}
  #topbar h1{font-size:14px;}
}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="brand">
      <div class="name">SOP DIGITAL LOGS</div>
      <div class="sub">EXTRUSION &amp; INJECTION</div>
    </div>
    <nav id="nav"></nav>
    <div id="sidebar-foot">Capstone prototype<br>Local data only — not yet linked to cloud</div>
  </div>
  <div id="main">
    <div id="topbar">
      <button id="hamburger" aria-label="Menu">&#9776;</button>
      <h1 id="topbar-title">Dashboard</h1>
      <span class="pill">● Local demo</span>
      <button id="install-btn" class="btn-ghost" style="display:none;">Install App</button>
      <button id="full-report-btn" class="btn-ghost">Full Shift Report (PDF)</button>
      <button id="full-report-whatsapp-btn" class="btn-ghost">Send to WhatsApp</button>
      <button id="export-btn" class="btn-ghost">Export to Excel</button>
      <button id="import-btn" class="btn-ghost">Import from Excel</button>
      <button id="email-btn" class="btn-ghost">Send Report</button>
      <input type="file" id="import-file" accept=".xlsx" style="display:none">
    </div>
    <div id="content"></div>
  </div>
</div>
<div id="toast"><div class="dot"></div><span id="toast-text"></span></div>
<div id="backdrop"></div>

<script>
/* ---------------- Master lists (from SOP) ---------------- */
const MACHINES = ["Extruder 1","Extruder 2","Injection 1","Injection 2","Injection 3","Injection 4","Mixer 1","Mixer 2"];
const PRODUCTS = ["HDPE Pipe","UPVC Pressure Pipe","UPVC Non-Pressure Pipe","Conduit","Drain Pipe","Hose","Gumboots","Pipe Fitting"];
const SHIFTS = ["Day Shift","Night Shift"];
const SCRAP_REASONS = ["Start-up scrap","Die blockage","Off-spec dimension","Colour change","Machine trial","Other"];
const SCRAP_CONDITION = ["Clean / Dry","Wet","Contaminated \u2013 mixed material","Contaminated \u2013 dirt/debris","Mixed Colours"];
const BREAKDOWN_CATEGORY = ["Mechanical","Electrical","Material","Die Change","QC Hold","No Operator"];
const BREAKDOWN_REASON = ["Screw wear","Heater failure","Die blockage","Mould change","Power cut","Material shortage","Other"];
/* ---------------- Factory staff, by category (from SOP_FACTORY_2026 "factory staff" sheet) ---------------- */
const SHIFT_IN_CHARGE = ["Innocent Mavhiyani","Trust Gweme"];
const OPERATORS = ["Takunda Kanhichire","Tinashe Magwanisa","Vitalis Denhere","Dennis Muzanenhamo","Walter Masimbiti","Eric Nyamapanda","Simon Tarubinga","Tchaona Makadho","Esmore Urombo","Ezias","Bothwell Marenzi","Blessed"];
const EXTRUDER_ASSISTANTS = ["Tried Chakubva","Farai Muronzwa","Munyaradzi Muhomba","Ngoni Mutena","Jonathan Chidindi","Shawn Nyaningwe","Trevor Mazanhi","Tafadzwa Chirengwa","Lenox Muhlaba","Patson Musekiwa","Tinotenda Samukange"];
const INJECTION_ASSISTANTS = ["Owen Gambo","Thinkwell Marumani","Remos Tsiga","Takunda Magauze","Malvern Nzombe","Jenkins Manvinema","Haward","Felix Sithole"];
const MIXER_ASSISTANTS = ["Biggie Mangwende","Tendai Dzuna","Witness Gova","Shepherd Mavhu","Passmore","Pearson","Nathan"];
const RECYCLING_TEAM = ["Bothwell Matibhiri","Kudakwashe Jemwa","Tinaye Zhou","Grammy Ndoda"];
const ISSUED_TO = ["Allan Mharandu","Collen Chamanga","Tinashe Chihota","Simbarashe Chaunoita","Never Shara"];
// Everyone who can be logged as running or assisting a machine (used on the Production Job Card,
// which covers extruders, injection machines and mixers with a single Operator/Assistant field)
const MACHINE_TEAM = [...OPERATORS, ...EXTRUDER_ASSISTANTS, ...INJECTION_ASSISTANTS, ...MIXER_ASSISTANTS].sort();

/* ---------------- Data model (from OPERATOR / QC / SCRAP FORM / SHIFT HANDOVER sheets) --- */
let production = [];
let qcChecks = [];
let scrapForms = [];
let handovers = [];
let mixingReports = [];
let scrapReceipts = [];

const STORE_KEY = "sop-digital-logs-v1";
async function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const d = JSON.parse(raw);
      production = d.production ?? production;
      qcChecks = d.qcChecks ?? qcChecks;
      scrapForms = d.scrapForms ?? scrapForms;
      handovers = d.handovers ?? handovers;
      mixingReports = d.mixingReports ?? mixingReports;
      scrapReceipts = d.scrapReceipts ?? scrapReceipts;
    }
  }catch(e){}
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify({production,qcChecks,scrapForms,handovers,mixingReports,scrapReceipts})); }catch(e){}
}

// A scrap-sent record is "Received" once a Scrap Receive entry references its id.
function scrapStatus(s){
  return scrapReceipts.some(r=>r.scrapRef===s.id) ? "Received \u2713" : "Awaiting Receipt";
}

/* ---------------- Nav ---------------- */
const VIEWS = [
  {id:"dashboard", label:"Dashboard"},
  {id:"production", label:"Production Job Card"},
  {id:"mixing", label:"Mixing Report"},
  {id:"qc", label:"QC Check Report"},
  {id:"scrap", label:"Scrap Handling (Sent)"},
  {id:"scrapreceive", label:"Scrap Receive (Recycling)"},
  {id:"handover", label:"Shift Handover"},
];
let current = "dashboard";
function renderNav(){
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  VIEWS.forEach(v=>{
    const el = document.createElement("div");
    el.className = "nav-item" + (v.id===current ? " active" : "");
    el.innerHTML = `<span class="dot"></span>${v.label}`;
    el.onclick = ()=>{ current=v.id; render(); closeSidebar(); };
    nav.appendChild(el);
  });
}
function opt(list, blank){ return (blank?`<option value="">Select…</option>`:"") + list.map(x=>`<option value="${x}">${x}</option>`).join(""); }
function toast(msg){
  const t=document.getElementById("toast");
  document.getElementById("toast-text").textContent = msg;
  t.classList.add("show");
  clearTimeout(window._t); window._t=setTimeout(()=>t.classList.remove("show"),3500);
}
function downloadCSV(filename, rows){
  const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast(`Downloaded ${filename}`);
}

/* ---------------- KPI calculations ---------------- */
function kpis(){
  const totalProd = production.reduce((a,b)=>a+Number(b.prodKg||0),0);
  const totalScrap = production.reduce((a,b)=>a+Number(b.scrapKg||0),0);
  const scrapPct = totalProd+totalScrap>0 ? (totalScrap/(totalProd+totalScrap)*100) : 0;

  const qcPassable = ["dropBend","fitting","color"];
  let passCount=0, totalCount=0;
  qcChecks.forEach(q=>{
    qcPassable.forEach(k=>{ if(q[k]==="Pass"||q[k]==="Fail"){ totalCount++; if(q[k]==="Pass") passCount++; } });
  });
  const qcPassRate = totalCount>0 ? (passCount/totalCount*100) : 100;

  function toMinutes(t){ if(!t) return null; const [h,m]=t.split(":").map(Number); return h*60+m; }
  let downtimeMin = 0;
  const reasonTotals = {};
  production.forEach(p=>{
    if(p.bdStart && p.bdEnd){
      const s=toMinutes(p.bdStart), e=toMinutes(p.bdEnd);
      if(s!=null && e!=null && e>s){
        downtimeMin += (e-s);
        const r = p.bdReason || "Unspecified";
        reasonTotals[r] = (reasonTotals[r]||0) + (e-s);
      }
    }
  });
  const pareto = Object.entries(reasonTotals).sort((a,b)=>b[1]-a[1]).slice(0,5);

  return {totalProd, totalScrap, scrapPct, qcPassRate, downtimeMin, pareto};
}

/* ---------------- Views ---------------- */
function renderDashboard(){
  const k = kpis();
  const maxBar = k.pareto.length ? k.pareto[0][1] : 1;
  return `
    <div class="section-head"><div><h2>Dashboard</h2><p>OEE-relevant KPIs calculated from your logged entries</p></div></div>
    <div class="kpi-row">
      <div class="kpi"><div class="num">${k.totalProd.toLocaleString()}</div><div class="lbl">TOTAL PRODUCTION (KG)</div></div>
      <div class="kpi ${k.scrapPct>5?'warn':''}"><div class="num">${k.scrapPct.toFixed(1)}%</div><div class="lbl">SCRAP RATE</div></div>
      <div class="kpi ${k.qcPassRate<95?'warn':''}"><div class="num">${k.qcPassRate.toFixed(1)}%</div><div class="lbl">QC PASS RATE</div></div>
      <div class="kpi ${k.downtimeMin>60?'warn':''}"><div class="num">${(k.downtimeMin/60).toFixed(1)}h</div><div class="lbl">TOTAL DOWNTIME</div></div>
    </div>
    <div class="pareto">
      <h3>TOP DOWNTIME REASONS (Pareto)</h3>
      ${k.pareto.length ? k.pareto.map(([reason,min])=>`
        <div class="bar-row">
          <div class="bar-label">${reason}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${(min/maxBar*100).toFixed(0)}%"></div></div>
          <div class="bar-val mono">${min} min</div>
        </div>`).join("") : `<div style="font-size:12.5px;color:var(--text-dim)">No breakdown entries logged yet.</div>`}
    </div>
    <div class="note"><strong>About these numbers:</strong> Scrap Rate and QC Pass Rate are calculated directly from your entries. Downtime is summed from breakdown start/end times logged on the Production Job Card. Full OEE (Availability × Performance × Quality) needs a planned run-time and ideal cycle time per product — add those once you've fixed a standard rate per product, and I'll wire the full OEE formula in.</div>
  `;
}

function renderProduction(){
  return `
    <div class="section-head"><div><h2>Production Job Card</h2><p>Hourly entry — matches your OPERATOR sheet</p></div></div>
    <div class="grid">
      <div class="card">
        <h3>New Entry</h3>
        <div class="field-row">
          <div class="field"><label>Date</label><input type="date" id="p-date"></div>
          <div class="field"><label>Shift</label><select id="p-shift">${opt(SHIFTS,true)}</select></div>
        </div>
        <div class="field"><label>Operator / Assistant</label><select id="p-operator">${opt(MACHINE_TEAM,true)}</select></div>
        <div class="field-row">
          <div class="field"><label>Machine</label><select id="p-machine">${opt(MACHINES,true)}</select></div>
          <div class="field"><label>Product</label><select id="p-product">${opt(PRODUCTS,true)}</select></div>
        </div>
        <div class="field"><label>Time Slot</label><input id="p-slot" placeholder="e.g. 7:30-8:30"></div>
        <div class="field-row">
          <div class="field"><label>Production (kg)</label><input type="number" id="p-prod"></div>
          <div class="field"><label>Scrap (kg)</label><input type="number" id="p-scrap"></div>
        </div>
        <div class="field"><label>Scrap Reason</label><select id="p-scrapreason">${opt(SCRAP_REASONS,true)}</select></div>
        <div class="field-row">
          <div class="field"><label>Breakdown Start</label><input type="time" id="p-bdstart"></div>
          <div class="field"><label>Breakdown End</label><input type="time" id="p-bdend"></div>
        </div>
        <div class="field"><label>Breakdown Reason</label><select id="p-bdreason">${opt(BREAKDOWN_REASON,true)}</select></div>
        <button class="btn-primary" onclick="addProduction()">Log entry</button>
      </div>
      <div>
        <div class="table-toolbar">
          <span class="count">${production.length} entries</span>
          <button class="btn-ghost" onclick="downloadCSV('production-log.csv',[['Date','Shift','Operator','Machine','Product','Time Slot','Production (kg)','Scrap (kg)','Scrap Reason','Breakdown Start','Breakdown End','Breakdown Reason'],...production.map(p=>[p.date,p.shift,p.operator,p.machine,p.product,p.timeSlot,p.prodKg,p.scrapKg,p.scrapReason,p.bdStart,p.bdEnd,p.bdReason])])">Download CSV</button>
          <button class="btn-ghost" onclick="exportProductionPDF()">Download PDF</button>
          <button class="btn-ghost" onclick="whatsappProductionPDF()">Send to WhatsApp</button>
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th>Date</th><th>Shift</th><th>Operator</th><th>Machine</th><th>Product</th><th>Slot</th><th>Prod (kg)</th><th>Scrap (kg)</th><th>Breakdown</th></tr></thead>
          <tbody>${production.map(p=>`<tr>
            <td>${p.date}</td><td>${p.shift}</td><td>${p.operator}</td><td>${p.machine}</td><td>${p.product}</td><td>${p.timeSlot}</td>
            <td>${p.prodKg}</td><td>${p.scrapKg}</td><td>${p.bdReason?`${p.bdStart}-${p.bdEnd} (${p.bdReason})`:'—'}</td>
          </tr>`).join("")}</tbody>
        </table></div>
      </div>
    </div>
  `;
}

function renderMixing(){
  return `
    <div class="section-head"><div><h2>Mixing Report</h2><p>Mixer / Mixer Assistant batch-mixing record</p></div></div>
    <div class="grid">
      <div class="card">
        <h3>New Batch Entry</h3>
        <div class="field-row">
          <div class="field"><label>Date</label><input type="date" id="m-date"></div>
          <div class="field"><label>Shift</label><select id="m-shift">${opt(SHIFTS,true)}</select></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Machine</label><select id="m-machine">${opt(MACHINES.filter(x=>x.startsWith("Mixer")),true)}</select></div>
          <div class="field"><label>Mixer Assistant</label><select id="m-assistant">${opt(MIXER_ASSISTANTS,true)}</select></div>
        </div>
        <div class="field-row">
          <div class="field"><label>No. of Mix Received</label><input type="number" id="m-received"></div>
          <div class="field"><label>Mix Done</label><input type="number" id="m-done"></div>
        </div>
        <div class="field"><label>Ratio of Mixing</label><input id="m-ratio" placeholder="e.g. 100:5:2"></div>
        <div class="field-row">
          <div class="field"><label>Mixing Time / Batch (min)</label><input type="number" id="m-time"></div>

window.onScrapRefChange = function(){
  const sel = document.getElementById("r-ref");
  const chosen = sel.options[sel.selectedIndex];
  document.getElementById("r-machine").value = chosen?.dataset.machine || "";
  document.getElementById("r-product").value = chosen?.dataset.product || "";

window.updateReceiveVariance = function(){
  const sent = Number(document.getElementById("r-sent").value||0);
  const recv = Number(document.getElementById("r-received").value||0);
  const hint = document.getElementById("r-variance-hint");
  if(!document.getElementById("r-ref").value || recv<=0){ hint.textContent=""; return; }
  const diff = sent - recv;
  const pct = sent>0 ? Math.abs(diff/sent*100) : 0;
  hint.textContent = pct<=5
    ? `Variance ${diff.toFixed(1)}kg (${pct.toFixed(1)}%) \u2014 within tolerance`
    : `\u26a0 Variance ${diff.toFixed(1)}kg (${pct.toFixed(1)}%) \u2014 will be flagged as a discrepancy`;
  hint.style.color = pct<=5 ? "var(--green)" : "var(--red)";
};
window.addScrapReceive = function(){
  const v = id=>document.getElementById(id).value;
  const ref = v("r-ref");
  if(!ref){ toast("Select which scrap-sent record this receipt verifies."); return; }
  if(!v("r-date") || !v("r-receivedby")){ toast("Fill in date and Received By."); return; }
  const sentKg = Number(v("r-sent")||0);
  const receivedKg = Number(v("r-received")||0);
  if(receivedKg<=0){ toast("Enter the weight actually received."); return; }
  const diffPct = sentKg>0 ? Math.abs((sentKg-receivedKg)/sentKg*100) : 0;
  const entry = {scrapRef:ref, date:v("r-date"), time:v("r-time"), receivedBy:v("r-receivedby"),
    machine:v("r-machine"), product:v("r-product"), sentKg, receivedKg,
    condition:v("r-condition"), status: diffPct<=5 ? "Verified OK" : "Discrepancy Flagged"};
  scrapReceipts.unshift(entry); saveState(); toast("Scrap receipt logged \u2014 " + entry.status); render();
};
window.addHandover = function(){
  const v = id=>document.getElementById(id).value;
  const totalProd = Number(v("h-prod")||0), totalScrap = Number(v("h-scrap")||0);
  const scrapPct = totalProd+totalScrap>0 ? +(totalScrap/(totalProd+totalScrap)*100).toFixed(1) : 0;
  const entry = {date:v("h-date"),shift:v("h-shift"),inCharge:v("h-incharge"),totalProd,totalScrap,scrapPct,

};

/* ---------------- PDF report generation (letterhead, table, sign-off) ---------------- */
async function loadImageDataURL(url){
  try{
    const res = await fetch(url);
    const blob = await res.blob();
    return await new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }catch(e){ return null; }
}

const BRAND_STEEL = [46,71,86];
const BRAND_INK = [22,26,30];
const BRAND_AMBER = [227,160,8];

async function pdfHeader(doc, title, subtitle){
  const pageWidth = doc.internal.pageSize.getWidth();
  doc.setFillColor(...BRAND_INK);
  doc.rect(0,0,pageWidth,22,"F");
  const logo = await loadImageDataURL("icon-512.png");
  if(logo){ try{ doc.addImage(logo,"PNG",10,3,16,16); }catch(e){} }
  doc.setTextColor(255,255,255);
  doc.setFont("helvetica","bold");
  doc.setFontSize(13);
  doc.text("SOP DIGITAL LOGS", 30, 10);
  doc.setFont("helvetica","normal");
  doc.setFontSize(8.5);
  doc.setTextColor(180,190,196);
  doc.text("EXTRUSION & INJECTION \u2014 PRODUCTION FLOOR", 30, 15.5);
  doc.setTextColor(...BRAND_INK);
  doc.setFont("helvetica","bold");
  doc.setFontSize(15);
  doc.text(title, 14, 32);
  doc.setFont("helvetica","normal");
  doc.setFontSize(9.5);
  doc.setTextColor(90,100,110);
  const now = new Date();
  doc.text(`${subtitle || ""}   Generated ${now.toLocaleDateString()} ${now.toLocaleTimeString()}`, 14, 38);
  doc.setDrawColor(...BRAND_AMBER);
  doc.setLineWidth(1);
  doc.line(14,41,pageWidth-14,41);
  return 47;
}

function pdfSignoff(doc, afterY, labels){
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  let y = afterY + 18;
  if(y > pageHeight - 15){ doc.addPage(); y = 25; }
  const colWidth = (pageWidth - 28) / labels.length;
  doc.setDrawColor(150,150,150);
  doc.setFontSize(9);
  doc.setTextColor(...BRAND_INK);
  labels.forEach((label,i)=>{
    const x = 14 + i*colWidth;
    doc.line(x, y, x+colWidth-10, y);
    doc.text(label, x, y+5);
  });
}

function pdfFooter(doc){
  const pageCount = doc.internal.getNumberOfPages();
  for(let i=1;i<=pageCount;i++){
    doc.setPage(i);
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    doc.setFontSize(8);
    doc.setTextColor(140,140,140);
    doc.text(`Page ${i} of ${pageCount}`, pageWidth-14, pageHeight-8, {align:"right"});
    doc.text("SOP Digital Logs \u2014 offline production record", 14, pageHeight-8);
  }
}

  return pdfHeader(doc, "Production Job Card Report", `${production.length} entries`).then(startY=>{
    doc.autoTable({
      startY,
      head: [["Date","Shift","Operator","Machine","Product","Slot","Prod (kg)","Scrap (kg)","Scrap Reason","Breakdown"]],
      body: production.map(p=>[p.date,p.shift,p.operator,p.machine,p.product,p.timeSlot,p.prodKg,p.scrapKg,p.scrapReason,p.bdReason?`${p.bdStart}-${p.bdEnd} (${p.bdReason})`:"\u2014"]),
      styles:{fontSize:8.5, cellPadding:2.2},
      headStyles:{fillColor:BRAND_STEEL, textColor:255, fontStyle:"bold"},
      alternateRowStyles:{fillColor:[247,248,248]},
      margin:{left:14,right:14},
    });
    pdfSignoff(doc, doc.lastAutoTable.finalY, ["Shift In Charge", "Supervisor"]);
    pdfFooter(doc);
    return {doc, filename:`production-job-card-${new Date().toISOString().slice(0,10)}.pdf`, summary:`Production Job Card Report \u2014 ${production.length} entries`};
  });

function buildQCPDF(){

  return pdfHeader(doc, "QC Check Report", `${qcChecks.length} checks`).then(startY=>{
    doc.autoTable({

      head: [["Date","Time","Machine","Product","PPH","Kgs/Hr","O/D","I/D","Drop/Bend","Fitting","Colour"]],
      body: qcChecks.map(q=>[q.date,q.time,q.machine,q.product,q.pph,q.kgsPerHr,q.od,q.id,q.dropBend,q.fitting,q.color]),
      styles:{fontSize:8.5, cellPadding:2.2},
      headStyles:{fillColor:BRAND_STEEL, textColor:255, fontStyle:"bold"},
      alternateRowStyles:{fillColor:[247,248,248]},
      didParseCell: (data)=>{
        if(data.section==="body" && [8,9,10].includes(data.column.index)){
          if(data.cell.raw==="Fail"){ data.cell.styles.textColor=[192,68,44]; data.cell.styles.fontStyle="bold"; }

      margin:{left:14,right:14},
    });
    pdfSignoff(doc, doc.lastAutoTable.finalY, ["QC Inspector", "Supervisor"]);
    pdfFooter(doc);
    return {doc, filename:`qc-check-report-${new Date().toISOString().slice(0,10)}.pdf`, summary:`QC Check Report \u2014 ${qcChecks.length} checks`};
  });

function buildFullReportPDF(){
  const doc = new window.jspdf.jsPDF({orientation:"landscape", unit:"mm", format:"a4"});
  return pdfHeader(doc, "Full Shift Report", "All sections \u2014 Production, Mixing, QC, Scrap, Handover").then(startY0=>{
    let startY = startY0;
    const k = kpis();
    doc.setFontSize(10);
    doc.setFont("helvetica","bold");
    doc.setTextColor(...BRAND_INK);
    doc.text("Summary", 14, startY);
    doc.autoTable({
      startY: startY+3,
      head: [["Total Production (kg)","Scrap Rate","QC Pass Rate","Total Downtime"]],
      body: [[k.totalProd.toLocaleString(), k.scrapPct.toFixed(1)+"%", k.qcPassRate.toFixed(1)+"%", (k.downtimeMin/60).toFixed(1)+"h"]],
      styles:{fontSize:9, cellPadding:3, halign:"center"},
      headStyles:{fillColor:BRAND_AMBER, textColor:[36,23,5], fontStyle:"bold"},
      margin:{left:14,right:14},
    });
    startY = doc.lastAutoTable.finalY + 10;

    function sectionTable(title, head, body){
      if(startY > doc.internal.pageSize.getHeight() - 40){ doc.addPage(); startY = 20; }
      doc.setFontSize(11);
      doc.setFont("helvetica","bold");
      doc.setTextColor(...BRAND_INK);
      doc.text(title, 14, startY);
      doc.autoTable({
        startY: startY+3,
        head:[head], body,
        styles:{fontSize:7.5, cellPadding:1.6},
        headStyles:{fillColor:BRAND_STEEL, textColor:255, fontStyle:"bold"},
        alternateRowStyles:{fillColor:[247,248,248]},
        margin:{left:14,right:14},
      });
      startY = doc.lastAutoTable.finalY + 10;
    }

    sectionTable("Production Job Card",
      ["Date","Shift","Operator","Machine","Product","Slot","Prod(kg)","Scrap(kg)","Breakdown"],
      production.map(p=>[p.date,p.shift,p.operator,p.machine,p.product,p.timeSlot,p.prodKg,p.scrapKg,p.bdReason?`${p.bdStart}-${p.bdEnd} (${p.bdReason})`:"\u2014"]));

    sectionTable("Mixing Report",
      ["Date","Shift","Machine","Assistant","Mix Recv'd","Mix Done","Ratio","Time/Batch","Mix Temp","Cooler Release"],
      mixingReports.map(m=>[m.date,m.shift,m.machine,m.assistant,m.mixReceived,m.mixDone,m.ratio,m.mixTime,m.mixTemp,m.coolerReleaseTemp]));

    sectionTable("QC Checks",
      ["Date","Time","Machine","Product","PPH","Kgs/Hr","Drop/Bend","Fitting","Colour"],
      qcChecks.map(q=>[q.date,q.time,q.machine,q.product,q.pph,q.kgsPerHr,q.dropBend,q.fitting,q.color]));

    sectionTable("Scrap Handling (Sent)",
      ["Date","Time","Shift In Charge","Machine","Sent By","Scrap(kg)","Received By","Status"],
      scrapForms.map(s=>[s.date,s.time,s.shiftInCharge,s.machine,s.operator,s.scrapKg,s.receiver,scrapStatus(s)]));

    sectionTable("Scrap Receive & Verification",
      ["Date","Received By","Machine","Sent(kg)","Received(kg)","Variance(kg)","Status"],
      scrapReceipts.map(r=>[r.date,r.receivedBy,r.machine,r.sentKg,r.receivedKg,(r.sentKg-r.receivedKg).toFixed(1),r.status]));

    sectionTable("Shift Handover",
      ["Date","Shift","In Charge","Total Prod(kg)","Total Scrap(kg)","Scrap %","Notes"],
      handovers.map(h=>[h.date,h.shift,h.inCharge,h.totalProd,h.totalScrap,h.scrapPct+"%",h.breakdownNotes]));

    pdfSignoff(doc, startY, ["Shift In Charge", "Production Supervisor", "Plant Manager"]);
    pdfFooter(doc);
    return {doc, filename:`full-shift-report-${new Date().toISOString().slice(0,10)}.pdf`, summary:"Full Shift Report \u2014 all sections"};
  });
}

/* ---------------- Send to WhatsApp ---------------- */
// Tries the native share sheet with the PDF file attached (works on Android Chrome,
// and on Windows in Chrome/Edge with WhatsApp Desktop installed). If the browser or
// device can't share files, falls back to opening WhatsApp with a text summary and
// downloading the PDF so it can be attached by hand.
async function shareToWhatsApp(doc, filename, summaryText){
  try{
    const blob = doc.output("blob");
    const file = new File([blob], filename, {type:"application/pdf"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:summaryText, text:summaryText});
      toast("Shared \u2014 choose WhatsApp from the share sheet");
      return;
    }
  }catch(e){
    if(e && e.name === "AbortError") return; // user cancelled the share sheet, do nothing
  }
  // Fallback: no file-sharing support on this browser/device
  doc.save(filename);
  const text = encodeURIComponent(`${summaryText}\n\n(PDF downloaded as ${filename} \u2014 attach it to this chat.)`);
  window.open(`https://wa.me/?text=${text}`, "_blank");
  toast("PDF downloaded \u2014 attach it in the WhatsApp chat that just opened");
}

/* ---------------- Install App (PWA) ---------------- */
let deferredInstallPrompt = null;
window.addEventListener("beforeinstallprompt", (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  document.getElementById("install-btn").style.display = "inline-block";
});
document.getElementById("install-btn").addEventListener("click", async ()=>{
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    document.getElementById("install-btn").style.display = "none";
  } else {
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    toast(isIOS
      ? "In Safari: tap Share, then \u2018Add to Home Screen\u2019."
      : "Use your browser menu \u2192 \u2018Install app\u2019 or \u2018Add to Home screen\u2019.");
  }
});
window.addEventListener("appinstalled", ()=>{
  document.getElementById("install-btn").style.display = "none";
  toast("App installed");
});

document.getElementById("import-btn").addEventListener("click", ()=>document.getElementById("import-file").click());
document.getElementById("import-file").addEventListener("change",(e)=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt)=>{
    try{
      const wb = XLSX.read(evt.target.result, {type:"array"});
      let n=0;
      const op = wb.Sheets["OPERATOR"];
      if(op){ production = XLSX.utils.sheet_to_json(op,{header:1}).slice(1).filter(r=>r[0]).map(r=>({
        date:String(r[0]||""),shift:r[1]||"",operator:r[2]||"",machine:r[3]||"",product:r[4]||"",timeSlot:r[5]||"",
        prodKg:Number(r[6])||0,scrapKg:Number(r[7])||0,scrapReason:r[8]||"",bdStart:r[9]||"",bdEnd:r[10]||"",bdReason:r[11]||""})); n++; }
      const qc = wb.Sheets["QC"];
      if(qc){ qcChecks = XLSX.utils.sheet_to_json(qc,{header:1}).slice(1).filter(r=>r[0]).map(r=>({
        date:String(r[0]||""),shift:r[1]||"",time:r[2]||"",machine:r[3]||"",product:r[4]||"",pph:r[5]||"",kgsPerHr:r[6]||"",
        od:r[7]||"",id:r[8]||"",dropBend:r[9]||"",fitting:r[10]||"",color:r[11]||""})); n++; }
      const sf = wb.Sheets["SCRAP FORM"];
      if(sf){ scrapForms = XLSX.utils.sheet_to_json(sf,{header:1}).slice(1).filter(r=>r[0]).map(r=>({
        date:String(r[0]||""),time:r[1]||"",shiftInCharge:r[2]||"",machine:r[3]||"",operator:r[4]||"",product:r[5]||"",
        scrapKg:Number(r[6])||0,receiver:r[7]||"",id:r[9]||("scrap"+Date.now()+Math.floor(Math.random()*1000))})); n++; }
      const mx = wb.Sheets["MIXING"];
      if(mx){ mixingReports = XLSX.utils.sheet_to_json(mx,{header:1}).slice(1).filter(r=>r[0]).map(r=>({
        date:String(r[0]||""),shift:r[1]||"",machine:r[2]||"",assistant:r[3]||"",mixReceived:Number(r[4])||0,mixDone:Number(r[5])||0,
        ratio:r[6]||"",mixTime:Number(r[7])||0,speed:Number(r[8])||0,mixTemp:Number(r[9])||0,coolerTime:Number(r[10])||0,
        coolerReleaseTemp:Number(r[11])||0,hotReleaseTemp:Number(r[12])||0})); n++; }
      const sr = wb.Sheets["SCRAP RECEIVE"];
      if(sr){ scrapReceipts = XLSX.utils.sheet_to_json(sr,{header:1}).slice(1).filter(r=>r[0]).map(r=>({
        date:String(r[0]||""),time:r[1]||"",receivedBy:r[2]||"",machine:r[3]||"",product:r[4]||"",
        sentKg:Number(r[5])||0,receivedKg:Number(r[6])||0,condition:r[7]||"",status:r[8]||"",scrapRef:r[9]||""})); n++; }
      const sh = wb.Sheets["SHIFT HANDOVER"];
      if(sh){ handovers = XLSX.utils.sheet_to_json(sh,{header:1}).slice(1).filter(r=>r[0]).map(r=>({
        date:String(r[0]||""),shift:r[1]||"",inCharge:r[2]||"",totalProd:Number(r[3])||0,totalScrap:Number(r[4])||0,
        scrapPct:Number(r[5])||0,breakdownNotes:r[6]||"",silo1:Number(r[7])||0,silo2:Number(r[8])||0,silo3:Number(r[9])||0,silo4:Number(r[10])||0})); n++; }
      saveState(); render();
      toast(n>0 ? `Imported data from ${file.name}` : "No matching sheets found.");
    }catch(err){ console.error(err); toast("Couldn't read that file."); }
  };
  reader.readAsArrayBuffer(file);
  e.target.value="";
});
