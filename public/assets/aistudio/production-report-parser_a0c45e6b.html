<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Production Report → Excel</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#1a1a1a;--sub:#666;--border:#dcdfe4;--accent:#2563eb;--accentT:#fff;--head:#eef1f6;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#17181a;--card:#232427;--text:#eee;--sub:#aaa;--border:#3a3b3e;--head:#2c2d30;}}
:root[data-theme="dark"]{--bg:#17181a;--card:#232427;--text:#eee;--sub:#aaa;--border:#3a3b3e;--head:#2c2d30;}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text);margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
body{padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));max-width:1000px;margin:0 auto;}
h1{font-size:1.25rem;margin:0 0 4px}
p.sub{color:var(--sub);margin:0 0 16px;font-size:.9rem}
textarea{width:100%;min-height:200px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:.9rem;resize:vertical}
.btns{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}
button{background:var(--accent);color:var(--accentT);border:none;padding:10px 18px;border-radius:8px;font-size:.9rem;cursor:pointer}
button.secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}
button:active{opacity:.8}
#status{font-size:.85rem;color:var(--sub);margin-bottom:8px;min-height:1.2em}
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.82rem;min-width:900px}
th,td{padding:7px 10px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
th{background:var(--head);position:sticky;top:0}
tr:hover td{background:var(--head)}
.empty{color:var(--sub);text-align:center;padding:24px;font-size:.85rem}
</style>
</head>
<body>
<h1>📋 Production Report → Excel</h1>
<p class="sub">Paste one or more WhatsApp shift reports below. Misspelled units, machine names, and "scrap" will be auto-corrected into the right columns.</p>
<textarea id="input" placeholder="Paste the WhatsApp production report(s) here..."></textarea>
<div class="btns">
<button onclick="runParse()">Parse Messages</button>
<button class="secondary" onclick="downloadXlsx()">⬇ Download Excel</button>
<button class="secondary" onclick="clearAll()">Clear</button>
</div>
<div id="status"></div>
<div class="tablewrap"><table id="out"><thead></thead><tbody></tbody></table></div>

<script>
const UNITS = ["GOOD PIECES","BAGS","BUNDLES","PIPES"];
const COLS = ["date","shift","dept","machine","operator","assistant","product","qty","unit","scrap","cd","reporter"];
const LABELS = {date:"Date",shift:"Shift",dept:"Department",machine:"Machine",operator:"Operator",assistant:"Assistant",product:"Product",qty:"Quantity",unit:"Unit",scrap:"Scrap",cd:"Cut Dust",reporter:"Reported By"};
let rows = [];

function lev(a,b){
  a=a||"";b=b||"";
  const m=a.length,n=b.length;
  const d=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++)d[i][0]=i;
  for(let j=0;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}

function matchKeyword(line,key){
  const m=line.match(/^([A-Za-z]+)\s*:?\s*(.*)$/);
  if(!m)return null;
  if(lev(m[1].toUpperCase(),key)<=2)return m[2].trim();
  return null;
}

function extractMachine(line,dept){
  const up=line.toUpperCase();
  const tryLine=(re,fmt)=>{
    const m=up.match(re);
    if(!m)return null;
    const idx=up.indexOf(m[0]);
    const rest=(line.slice(0,idx)+line.slice(idx+m[0].length)).replace(/^[\s.,-]+/,'').trim();
    return {machine:fmt(m),rest};
  };
  if(dept!=='Extrusion'){
    const r=tryLine(/I\.?\s*M\.?\s*(\d+)/, m=>'IM'+m[1]);
    if(r)return r;
  }
  const r2=tryLine(/LINE\s*0?(\d+)/, m=>'LINE '+m[1].padStart(2,'0'));
  if(r2)return r2;
  if(dept==='Extrusion'){
    return tryLine(/I\.?\s*M\.?\s*(\d+)/, m=>'IM'+m[1]);
  }
  return null;
}

function isScrapLine(line){
  const w=(line.trim().split(/\s+/)[0]||'').toUpperCase().replace(/[^A-Z]/g,'');
  return w.length>=3 && lev(w,'SCRAP')<=2;
}
function trailingValue(line){
  const m=line.match(/([\d]+\.?[\d]*|NIL)\s*$/i);
  return m?m[1].toUpperCase():'';
}
function extractQty(line){
  const m=line.match(/^([\d][\d,]*)\s*(.*)$/);
  if(!m)return null;
  const qty=m[1].replace(/,/g,'');
  const raw=m[2].trim().toUpperCase();
  if(!raw)return null;
  let best=null,bd=Infinity;
  UNITS.forEach(u=>{
    const d=lev(raw,u);
    const th=Math.ceil(u.length/3)+1;
    if(d<=th && d<bd){bd=d;best=u;}
  });
  if(!best)return null;
  return {qty,unit:best};
}

function newRow(ctx){
  return {date:ctx.date,shift:ctx.shift,dept:ctx.dept,machine:'',operator:'',assistant:'',product:'',qty:'',unit:'',scrap:'',cd:'',reporter:''};
}

function parseText(text){
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const out=[];
  const ctx={date:'',shift:'',dept:'',lastMachine:{}};
  let cur=null;

  function push(){
    if(cur && (cur.operator||cur.product||cur.qty)){
      if(!cur.machine) cur.machine=ctx.lastMachine[cur.dept]||'';
      else ctx.lastMachine[cur.dept]=cur.machine;
      out.push(cur);
    }
    cur=null;
  }

  for(const line of lines){
    const up=line.toUpperCase();

    const dm=line.match(/\((\d{1,2}\/\d{1,2}\/\d{4})\)/);
    if(dm){ ctx.date=dm[1]; if(up.includes('NIGHT'))ctx.shift='Night'; else if(up.includes('DAY'))ctx.shift='Day'; continue; }
    if(up.includes('SHIFT') && (up.includes('NIGHT')||up.includes('DAY'))){ ctx.shift=up.includes('NIGHT')?'Night':'Day'; continue; }
    if(up==='GOOD MORNING' || up.includes('PRODUCTION REPORT')) continue;

    const fm=line.match(/^FROM:?\s*(.+)/i);
    if(fm){
      push();
      const reporter=fm[1].trim();
      out.filter(r=>r.date===ctx.date && r.shift===ctx.shift).forEach(r=>r.reporter=reporter);
      continue;
    }

    if(/^[A-Za-z\s]+$/.test(line) && line.split(/\s+/).length<=2){
      let best=null,bd=Infinity;
      ['INJECTION','EXTRUSION'].forEach(s=>{const d=lev(up,s); if(d<bd){bd=d;best=s;}});
      if(bd<=2){ push(); ctx.dept=best[0]+best.slice(1).toLowerCase(); continue; }
    }

    const om=matchKeyword(line,'OPERATOR');
    if(om!==null){ push(); cur=newRow(ctx); cur.operator=om; continue; }
    const am=matchKeyword(line,'ASSISTANT');
    if(am!==null && cur){ cur.assistant=am; continue; }

    if(cur){
      const mm=extractMachine(line,ctx.dept);
      if(mm){ cur.machine=mm.machine; if(mm.rest) cur.product=cur.product?cur.product+' '+mm.rest:mm.rest; continue; }
      if(isScrapLine(line)){ cur.scrap=trailingValue(line); continue; }
      if(/^CD\b/i.test(line)){ cur.cd=trailingValue(line); continue; }
      const qm=extractQty(line);
      if(qm){ cur.qty=qm.qty; cur.unit=qm.unit; continue; }
      cur.product=cur.product?cur.product+' '+line:line;
    }
  }
  push();
  return out;
}

function runParse(){
  const text=document.getElementById('input').value;
  rows=parseText(text);
  render();
  document.getElementById('status').textContent=rows.length? `Parsed ${rows.length} record(s).` : 'No records found — check the pasted text.';
}

function render(){
  const thead=document.querySelector('#out thead');
  const tbody=document.querySelector('#out tbody');
  thead.innerHTML=''; tbody.innerHTML='';
  if(!rows.length){ tbody.innerHTML=`<tr><td class="empty" colspan="${COLS.length}">Nothing parsed yet.</td></tr>`; return; }
  const tr=document.createElement('tr');
  COLS.forEach(c=>{const th=document.createElement('th'); th.textContent=LABELS[c]; tr.appendChild(th);});
  thead.appendChild(tr);
  rows.forEach(r=>{
    const row=document.createElement('tr');
    COLS.forEach(c=>{const td=document.createElement('td'); td.textContent=r[c]||''; row.appendChild(td);});
    tbody.appendChild(row);
  });
}

async function downloadXlsx(){
  if(!rows.length){ document.getElementById('status').textContent='Parse messages first.'; return; }
  const data=rows.map(r=>{const o={}; COLS.forEach(c=>o[LABELS[c]]=r[c]); return o;});
  const ws=XLSX.utils.json_to_sheet(data);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Production');
  const wbout=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  const blob=new Blob([wbout],{type:'application/octet-stream'});
  const filename='production_report.xlsx';
  try{
    const downloads = await claude.use('downloads');
    if(downloads){
      const buf=await blob.arrayBuffer();
      await downloads.save({filename, data:buf});
      return;
    }
  }catch(e){}
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  a.remove(); URL.revokeObjectURL(url);
}

function clearAll(){
  document.getElementById('input').value='';
  rows=[]; render();
  document.getElementById('status').textContent='';
}
render();
</script>
</body>
</html>
